server:
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: local-server
  messages:
    basename: i18n.messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: true
  jackson:
    time-zone: UTC
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:10.168.1.59}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:freepark_local}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:tk778899}
    hikari:
      pool-name: freepark-local-hikari
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

freepark:
  jwt:
    secret: ${JWT_SECRET:freepark-local-dev-secret-change-me-32}
    ttl: 12h
  admin:
    username: ${FREEPARK_ADMIN_USERNAME:admin}
    password: ${FREEPARK_ADMIN_PASSWORD:admin123}
    display-name: ${FREEPARK_ADMIN_DISPLAY_NAME:Administrator}
