server:
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: local-server
  messages:
    basename: i18n.messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: true
  jackson:
    time-zone: UTC
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:8306}/${MYSQL_DATABASE:freepark_local}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&rewriteBatchedStatements=true
    username: ${MYSQL_USER:freepark_local}
    password: ${MYSQL_PASSWORD:freepark_local}
    hikari:
      pool-name: freepark-local-hikari
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:20MB}
  mvc:
    async:
      request-timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

freepark:
  camera-whitelist-sync:
    # 定时对账：到点写入、过期移除；未生效创建时不预下发（与手动保存/删除同一入队路径）
    initial-delay-ms: ${CAMERA_WHITELIST_SYNC_INITIAL_DELAY_MS:5000}
    interval-ms: ${CAMERA_WHITELIST_SYNC_INTERVAL_MS:30000}
  preview:
    # Frigate 内置 go2rtc 端口；拉流失败时再试 Frigate API 上的 /api/go2rtc 反代
    go2rtc-port: ${GO2RTC_PORT:1984}
    try-frigate-api-proxy: ${GO2RTC_VIA_FRIGATE:true}
    max-sessions: ${PREVIEW_MAX_SESSIONS:2}
    connect-timeout: ${PREVIEW_CONNECT_TIMEOUT:20s}
  frigate:
    api-host: ${FRIGATE_API_HOST:127.0.0.1}
    mqtt-host: ${FRIGATE_MQTT_HOST:127.0.0.1}
    # 同一相机识别出同一合法车牌后的入库去重窗口（毫秒）
    plate-dedup-window-ms: ${FRIGATE_PLATE_DEDUP_WINDOW_MS:30000}
  jwt:
    secret: ${JWT_SECRET:freepark-local-dev-secret-change-me-32}
    ttl: 12h
  admin:
    username: ${FREEPARK_ADMIN_USERNAME:admin}
    password: ${FREEPARK_ADMIN_PASSWORD:admin123}
    display-name: ${FREEPARK_ADMIN_DISPLAY_NAME:Administrator}
