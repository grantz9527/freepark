name: freepark-mosquitto

# 调试用 MQTT Broker（账号 freepark / freepark）。不是场端默认五服务之一。
# 仓库根目录：
#   docker compose -f docker/mosquitto/docker-compose.yml up -d

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: freepark-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config:/mosquitto/config:ro
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
    environment:
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/version' -C 1 -W 2 -u freepark -P freepark -h 127.0.0.1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s
