services:
  mysql:
    image: mysql:8.4
    container_name: freepark-mysql
    environment:
      MYSQL_DATABASE: freepark
      MYSQL_USER: freepark
      MYSQL_PASSWORD: freepark
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+00:00
    volumes:
      - freepark-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  freepark-mysql:
