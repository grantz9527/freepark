name: freepark-ai-build

# 场端 Docker 只这三项。版本钉死见 ai-build/VERSIONS.md。
# 不要在本仓库起 MQTT Broker。
#
# 仓库根目录：
#   docker compose -f ai-build/docker-compose.yml up -d --build
# 或 ai-build/windows/up.ps1 、 ai-build/linux/up.sh

services:
  mysql:
    image: mysql:8.4.11
    container_name: freepark-local-mysql
    environment:
      MYSQL_DATABASE: freepark_local
      MYSQL_USER: freepark_local
      MYSQL_PASSWORD: freepark_local
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+00:00
    volumes:
      - freepark-local-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  hyperlpr3:
    build:
      context: ../docker/hyperlpr3
      dockerfile: Dockerfile
    image: freepark-hyperlpr3:0.1.3
    container_name: freepark-hyperlpr3
    restart: unless-stopped
    ports:
      - "8715:8715"

  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.2
    container_name: frigate
    restart: unless-stopped
    shm_size: "128mb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../docker/frigate/config:/config
      - frigate-storage:/media/frigate
    ports:
      - "5000:5000"
      - "1935:1935"
      - "8554:8554"
      - "8555:8555"
      - "8555:8555/udp"
      - "1984:1984"
    environment:
      TZ: Asia/Shanghai

volumes:
  freepark-local-mysql:
  frigate-storage:
    name: frigate-storage
